<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
      <ion-back-button>Mesa</ion-back-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ">

  <ion-item>
    <ion-label position="floating">Ip del servidor</ion-label>
    <ion-input placeholder="Enter text"></ion-input>
  </ion-item>
  <ion-button id="open-modal" expand="block" shape="round">
    Asignar mesas
  </ion-button>
  <!--Añadir mas contenido-->
  <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item *ngFor="let mesa of mesas;let i= index">
          <ion-grid>
            <ion-row>
              <ion-col size="4">
                <p *ngIf="mesa.nombreMesa!==null">{{mesa.nombreMesa}}</p>
                <p *ngIf="mesa.nombreMesa===null">{{mesa.numTel}}<p>
                  </ion-col>
                  <ion-col size="3">
                    <p>{{usuarios[mesa.idusu-1].nombre}}</p>
                  </ion-col>
                  <ion-col size="5">
                    <ion-item>
                      <ion-select [(ngModel)]="usuSelect[i+1]">
                        <ion-select-option *ngFor="let usu of usuarios"
                          [value]="usu.id">{{usu.nombre}}</ion-select-option>
                      </ion-select>
                    </ion-item>
                  </ion-col>
                </ion-row>
              </ion-grid>



            </ion-item>
          </ion-content>
        </ng-template>
      </ion-modal>
    </ion-content>
