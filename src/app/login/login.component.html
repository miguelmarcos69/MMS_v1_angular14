
<ion-grid>
  <ion-card>
    <ion-row id="centro">
      <ion-col size="3">
      </ion-col>
      <ion-col size="6">
        <img src="../../../../assets/logos/logo2.png" alt="">
      </ion-col>
      <ion-col size="3">
      </ion-col>
    </ion-row>
    <ion-item>
      <ion-label>Usuario</ion-label>
      <ion-input [(ngModel)]="nombre" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Contraseña</ion-label>
      <ion-input [(ngModel)]="contra" type="password"></ion-input>
    </ion-item>
    <ion-button (click)="onLogin()" expand="block" fill="clear" shape="round">
      Acceder
    </ion-button>

  </ion-card>
</ion-grid>
