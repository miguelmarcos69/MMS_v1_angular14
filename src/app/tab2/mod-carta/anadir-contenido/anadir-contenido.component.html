<ion-header>
  <ion-toolbar>
  <ion-buttons slot="start">
    <ion-back-button></ion-back-button>
  </ion-buttons>
    <ion-title>Añadir contenido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" id="fondo">

  <ion-grid>
    <ion-row id="centro">
      <ion-col size="3">
      </ion-col>
      <ion-col size="6">
        <img src="../../../../assets/logos/logo2.png" alt="">
      </ion-col>
      <ion-col size="3">
      </ion-col>
    </ion-row>
  </ion-grid>


  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-list *ngIf="tipo==='platos'">
    <ion-item>
      <ion-label position="stacked">Nombre del plato</ion-label>
      <ion-input [clearInput]="true" [(ngModel)]="nomSelec"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Ingredientes</ion-label>
      <ion-select placeholder="Introduce ingredientes" [(ngModel)]="ingSelec"
        [multiple]="true">
        <ion-select-option *ngFor="let ing of ingredientes" [value]="ing.id">{{ing.nombre}}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Precio</ion-label>
      <ion-input type="number" [clearInput]="true" [(ngModel)]="precSelec"></ion-input>
    </ion-item>
    <ion-img [src]="previsualizacion" id='pev'></ion-img>
    <ion-button expand="block">
      Añadir imagen &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      &nbsp;&nbsp;
      <ion-input type="file" (change)="capturarFile($event)"></ion-input>
    </ion-button>
    <ion-button id="open-modalIngr" expand="block">Añadir ingrediente</ion-button>
    <ion-button (click)="crear()" expand="block">
      Crear
    </ion-button>
  </ion-list>
  <ion-list *ngIf="tipo==='bebida'">
    <ion-item>
      <ion-label position="stacked">Nombre de la bebida</ion-label>
      <ion-input [clearInput]="true" [(ngModel)]="nomSelec"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Precio</ion-label>
      <ion-input type="number" [clearInput]="true" [(ngModel)]="precSelec"></ion-input>
    </ion-item>

    <ion-img [src]="previsualizacion" id='pev'></ion-img>

    <ion-button expand="block">
      Añadir imagen &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      &nbsp;&nbsp;
      <ion-input type="file" (change)="capturarFile($event)"></ion-input>
    </ion-button>
    <ion-button (click)="crear()" expand="block" shape="round">
      Crear
    </ion-button>
  </ion-list>


  <ion-modal trigger="open-modalIngr" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">
              <ion-icon name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
          <ion-title>Añadir ingrediente</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">
              <ion-icon name="checkmark-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked">Introdice el nomnbre el ingrediente</ion-label>
          <ion-input type="text" placeholder="Añade el ingrediente"
            [(ngModel)]="name"></ion-input>
        </ion-item>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
