<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button>

      </ion-menu-button>
    </ion-buttons>
    <ion-title>Menú</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">

  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu Content</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-button (click)="onLogin()" expand="block">Login</ion-button>
      <ion-button (click)="onLogout()" expand="block">Cerrar Sesión</ion-button>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
  </div>
  <app-comandas [usuario]="usuario"></app-comandas>
</ion-content>
